name: Verify HOE starter
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify package installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build deployment files
        run: npm run build
      - name: Test built website and counters
        run: npm test
