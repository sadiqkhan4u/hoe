name: Verify HOE starter
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify package installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build deployment files
        run: npm run build
      - name: Test built website and counters
        run: npm test
      - name: Install isolated browser test tools
        run: npm install --prefix .ci-runtime --no-save --package-lock=false --no-audit --no-fund playwright@1.64.0
      - name: Install Chromium
        run: .ci-runtime/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify desktop and mobile page in Chromium
        run: node test/browser.mjs
      - name: Check live deployment without revealing private settings
        if: github.ref == 'refs/heads/main'
        run: node test/deployment.mjs
      - name: Save preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoe-page-previews
          path: artifacts/*.png
          if-no-files-found: ignore
